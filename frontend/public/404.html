<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The 12th Man</title>
    <script type="text/javascript">
      // SPA redirect fallback for static hosts serving 404.html
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path ? '?redirect=' + encodeURIComponent(path + search + hash) : ''));
    </script>
  </head>
  <body style="background:#0e1117;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Loading The 12th Man...</p>
  </body>
</html>
